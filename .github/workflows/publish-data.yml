name: Publish conference data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/build_feed.py"
      - "scripts/validate_data.py"
      - ".github/workflows/publish-data.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: conference-data-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@v6
      - run: python scripts/build_feed.py --revision "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/feed

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy immutable data feed
        id: deployment
        uses: actions/deploy-pages@v5
