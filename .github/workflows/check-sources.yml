name: Check Source

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # 08:00 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Compare sources and write review report (no LLM)
        run: python3 scripts/check_sources.py
      - name: Upload HTML report and frozen observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: source-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/source-check/report.html
            build/source-check/report.json
          if-no-files-found: warn
          retention-days: 14
