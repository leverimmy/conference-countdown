name: Release macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Info.plist"
      - "build.sh"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Read and check version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "CFBundleShortVersionString must use MAJOR.MINOR.PATCH, got: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Increment CFBundleShortVersionString before releasing app changes." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ad-hoc signed universal app
        env:
          COUNTDOWN_ARCHS: arm64 x86_64
          COUNTDOWN_MARKETING_VERSION: ${{ steps.version.outputs.version }}
          COUNTDOWN_BUILD_NUMBER: ${{ github.run_number }}
        run: zsh build.sh

      - name: Verify architectures and signature
        run: |
          lipo -archs build/Conference-Countdown.app/Contents/MacOS/ConferenceCountdown
          codesign --verify --deep --strict --verbose=2 build/Conference-Countdown.app

      - name: Package app
        id: archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ARCHIVE="Conference-Countdown-$RELEASE_TAG-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Conference-Countdown.app "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > SHA256SUMS.txt
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Conference Countdown $RELEASE_TAG" \
            --generate-notes
