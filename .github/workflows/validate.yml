name: Validate data and app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data:
    name: Validate canonical data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/validate_data.py
      - run: python scripts/build_feed.py --revision validation

  app:
    name: Build universal macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: COUNTDOWN_ARCHS="arm64 x86_64" zsh build.sh
      - run: lipo -archs build/Conference-Countdown.app/Contents/MacOS/ConferenceCountdown
      - run: codesign --verify --deep --strict build/Conference-Countdown.app
